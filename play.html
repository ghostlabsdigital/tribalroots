<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tribal Roots: Underground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik+Dirt&family=Barlow+Condensed:wght@600;700;800&display=swap">
<style>
  /* Arcade cabinet: one 16:9 screen, letterboxed, nothing else competes with it. Single dark look by choice. */
  :root {
    --void: #07050a; --panel: #130d1a; --ink: #fff4e6; --dim: #8d7f99;
    --lotus: #36f0cf; --ghost: #ff7a1a; --blood: #ff2a3d;
    --hud: "Barlow Condensed", "Arial Narrow", sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--void); color: var(--ink); font-family: var(--hud);
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 8px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    overflow: hidden; overscroll-behavior: none; touch-action: manipulation; user-select: none; -webkit-user-select: none;
  }
  #stage { position: relative; width: min(100%, calc((100dvh - 64px) * 16 / 9)); aspect-ratio: 16 / 9; max-width: 100%; background: var(--void); box-shadow: 0 0 0 2px var(--panel), 0 20px 80px rgba(160, 123, 255, 0.12); }
  #stage:fullscreen { width: 100%; height: 100%; box-shadow: none; }
  #game { display: block; width: 100%; height: 100%; image-rendering: auto; cursor: pointer; }
  .bar { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; justify-content: center; font-size: 15px; letter-spacing: 0.06em; color: var(--dim); text-transform: uppercase; font-weight: 600; }
  .bar b { color: var(--ink); font-weight: 700; }
  .bar button { font: 700 15px var(--hud); letter-spacing: 0.08em; text-transform: uppercase; background: var(--panel); color: var(--ink); border: 1px solid #2b2233; padding: 6px 12px; cursor: pointer; }
  .bar button:hover { border-color: var(--blood); }
  .bar button:focus-visible { outline: 2px solid var(--lotus); outline-offset: 2px; }
  /* touch pad — only shown on touch devices */
  #touch { position: absolute; inset: 0; pointer-events: none; }
  #touch .dpad, #touch .btns { position: absolute; bottom: 14%; display: grid; gap: 6px; pointer-events: auto; }
  #touch .dpad { left: 2%; grid-template-columns: repeat(3, 13vmin); grid-template-rows: repeat(3, 13vmin); }
  #touch .btns { right: 2%; grid-template-columns: repeat(4, 12vmin); grid-template-rows: repeat(2, 12vmin); }
  #touch button { border-radius: 50%; border: 2px solid rgba(255, 244, 230, 0.35); background: rgba(19, 13, 26, 0.45); color: var(--ink); font: 800 3.2vmin var(--hud); touch-action: none; }
  #touch .dpad button { border-radius: 10px; }
  #touch button.on { background: rgba(255, 42, 61, 0.6); }
  #touch .su { background: rgba(255, 122, 26, 0.45); }
  #pause-btn { position: absolute; top: 1.5%; left: 50%; transform: translateX(-50%) translateY(76px); pointer-events: auto; border-radius: 6px !important; padding: 4px 10px; font-size: 2.4vmin !important; }
  @media (max-width: 700px) { .bar .keys { display: none; } }
  body.embed .bar { display: none; }
  body.embed #stage { width: min(100%, calc((100dvh - 16px) * 16 / 9)); }
  /* portrait phone: screen on top, controller underneath (no thumbs over the fight) */
  body.touch.portrait { justify-content: center; padding: 8px 8px calc(46vw + 20px); }
  body.touch.portrait #stage { width: 100%; }
  body.touch.portrait #touch { inset: auto 0 auto 0; top: calc(100% + 12px); height: 46vw; }
  body.touch.portrait #touch .dpad { left: 0; top: 0; bottom: auto; grid-template-columns: repeat(3, 12vw); grid-template-rows: repeat(3, 12vw); }
  body.touch.portrait #touch .btns { right: 0; top: 7vw; bottom: auto; grid-template-columns: repeat(4, 11vw); grid-template-rows: repeat(2, 11vw); gap: 2vw; }
  body.touch.portrait #touch button { font-size: 3.6vw; background: rgba(36, 27, 46, 0.9); }
  body.touch.portrait #touch .su { background: rgba(255, 122, 26, 0.55); }
  body.touch.portrait #pause-btn { top: auto; bottom: 0; transform: translateX(-50%); font-size: 13px !important; padding: 6px 14px; }
  body.touch.portrait .bar { display: none; }
  body.touch #game { touch-action: none; }
  /* joystick: thumb lands anywhere in the zone, that spot becomes centre */
  #touch .stick { position: absolute; left: 0; bottom: 0; width: 42%; height: 62%; pointer-events: auto; touch-action: none; }
  #touch .stick .base { position: absolute; width: 30vmin; height: 30vmin; left: 6vmin; bottom: 8vmin; border-radius: 50%;
    background: radial-gradient(circle, rgba(19,13,26,0.35) 0 55%, rgba(19,13,26,0.55) 56%); border: 2px solid rgba(255,244,230,0.3); transform: translate(0,0); }
  #touch .stick .knob { position: absolute; width: 13vmin; height: 13vmin; border-radius: 50%; left: 14.5vmin; bottom: 16.5vmin;
    background: radial-gradient(circle at 35% 30%, rgba(255,244,230,0.55), rgba(255,42,61,0.45)); border: 2px solid rgba(255,244,230,0.6); box-shadow: 0 4px 14px rgba(0,0,0,0.5); }
  #touch .stick .ar { position: absolute; color: rgba(255,244,230,0.45); font: 800 3.2vmin var(--hud); }
  #touch .stick .ar.u { left: 50%; top: 3%; transform: translateX(-50%); } #touch .stick .ar.d { left: 50%; bottom: 3%; transform: translateX(-50%); }
  #touch .stick .ar.l { left: 4%; top: 50%; transform: translateY(-50%); } #touch .stick .ar.r { right: 4%; top: 50%; transform: translateY(-50%); }
  #touch .stick .ar.hot { color: #ffcf3f; transform: translate(var(--tx,0), var(--ty,0)) scale(1.35); text-shadow: 0 0 10px rgba(255,207,63,0.9); }
  #touch .stick .ar.u, #touch .stick .ar.d { --tx: -50%; } #touch .stick .ar.l, #touch .stick .ar.r { --ty: -50%; }
  body.touch.portrait #touch .stick { width: 50%; height: 100%; }
  body.touch.portrait #touch .stick .base { width: 36vw; height: 36vw; left: 4vw; bottom: auto; top: 3vw; }
  body.touch.portrait #touch .stick .knob { width: 15vw; height: 15vw; left: 14.5vw; bottom: auto; top: 13.5vw; }
  body.touch.portrait #touch .stick .ar { font-size: 3.8vw; }
  /* sideways: controls float over the edges of the screen, see-through */
  body.touch:not(.portrait) #touch .btns { opacity: 0.85; }
  body.touch .bar .keys { display: none; }
</style>
</head>
<body>


<script>if (/[?&]embed\b/.test(location.search)) document.body.classList.add("embed");</script>
<script>
  (function () { // first key/tap inside the game -> ask the site to start the music
    let sent = false; const go = () => { if (sent) return; sent = true; try { parent.postMessage({ tru: 'start' }, '*'); } catch (e) {} };
    addEventListener('keydown', go, true); addEventListener('pointerdown', go, true);
  })();
</script>
<div id="stage">
  <canvas id="game" width="1280" height="720" aria-label="Tribal Roots: Underground game screen"></canvas>
  <div id="touch" hidden>
    <div class="stick" id="stick" aria-label="Move: slide your thumb. Push up to jump.">
      <div class="base"><span class="ar u">▲</span><span class="ar l">◀&#xFE0E;</span><span class="ar r">▶&#xFE0E;</span><span class="ar d">▼</span></div>
      <div class="knob"></div>
    </div>
    <div class="btns">
      <button data-k="lp">LP</button><button data-k="hp">HP</button><button data-k="s1">S1</button><button class="su" data-k="su">SUP</button>
      <button data-k="lk">LK</button><button data-k="hk">HK</button><button data-k="s2">S2</button><button data-k="s3">S3</button>
    </div>
    <button id="pause-btn" aria-label="Pause">II</button>
  </div>
</div>
<div class="bar">
  <span class="keys"><b>P1</b> WASD · J K L ; attack · N M , special · . super</span>
  <span class="keys"><b>P2</b> Arrows · Numpad 1 2 3 + · 4 5 6 · 0</span>
  <button id="mute" type="button">Sound on</button>
  <button id="full" type="button">Fullscreen</button>
</div>

<script src="js/manifests.js"></script>
<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/story.js"></script>
<script>
  document.getElementById('mute').addEventListener('click', e => { AU.init(); AU.setMuted(!AU.muted); e.target.textContent = AU.muted ? 'Sound off' : 'Sound on'; e.target.blur(); });
  document.getElementById('full').addEventListener('click', e => { try { document.fullscreenElement ? document.exitFullscreen() : document.getElementById('stage').requestFullscreen().catch(() => {}); } catch (err) {} e.target.blur(); });
</script>

</body>
</html>
